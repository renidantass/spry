[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spry-core"
version = "0.1.0"
description = "Opinionated Python web framework with an EF Core-inspired ORM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
mysql = ["pymysql"]
mariadb = ["pymysql"]
sqlserver = ["pyodbc"]
jinja2 = ["jinja2>=3.0"]
all = ["psycopg2-binary", "pymysql", "pyodbc", "jinja2>=3.0"]

[project.scripts]
spry = "spry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spry = ["templates/**/*"]
