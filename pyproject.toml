[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spry-core"
version = "0.8.3"
description = "Opinionated Python web framework with an EF Core-inspired ORM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Reni Dantas", email = "reni@spry.dev"}]
keywords = ["web", "framework", "orm", "api", "mvc", "wsgi", "asgi", "aspnet-core-inspired", "python-web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    
]
dependencies = []

[project.urls]
Homepage = "https://spry.dev"
Repository = "https://github.com/renidantass/spry"
Documentation = "https://spry.dev/docs"
Changelog = "https://github.com/renidantass/spry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
mysql = ["pymysql"]
mariadb = ["pymysql"]
sqlserver = ["pyodbc"]
jinja2 = ["jinja2>=3.0"]
all = ["psycopg2-binary", "pymysql", "pyodbc", "jinja2>=3.0"]

[project.scripts]
spry = "spry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spry = ["templates/**/*"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.3"
version_files = ["pyproject.toml:^version = "]
tag_format = "v$version"
bump_message = "chore(release): v$current_version → v$new_version [skip ci]"



