name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{"share":"disabled"}'
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Analise este pull request:
            - Verifique problemas de qualidade de codigo
            - Procure por potenciais bugs
            - Sugira melhorias
            - Seja criativo e bem humorado nas sugestoes