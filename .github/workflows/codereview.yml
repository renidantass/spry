name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number
            });

            const diff = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
              mediaType: { format: "diff" }
            }).then(r => r.data);

            const diffPreview = (diff || "").slice(0, 15000);

            const response = await fetch("https://opencode.ai/zen/go/v1/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.OPENCODE_GO_API_KEY}`
              },
              body: JSON.stringify({
                model: "deepseek-v4-flash",
                messages: [
                  { role: "user", content: "Analise este PR:\nTitulo: " + pr.title + "\nAutor: " + pr.user.login + "\n- Verifique problemas de qualidade de codigo\n- Procure por potenciais bugs\n- Sugira melhorias\n\nDiff:\n" + diffPreview }
                ],
                max_tokens: 8192
              })
            });

            const status = response.status;
            const data = await response.json();

            core.info(`API status: ${status}`);
            core.info(`API response: ${JSON.stringify(data)}`);

            const msg = data.choices?.[0]?.message;
            const review = msg?.content || msg?.reasoning_content || "";
            if (!review) {
              core.setFailed(`API error (${status}): ${data.error?.message || "resposta vazia"} - ${JSON.stringify(data)}`);
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## AI Code Review\n\n${review}`
            });
