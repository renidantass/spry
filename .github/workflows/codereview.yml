name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number
            });

            const diff = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
              mediaType: { format: "diff" }
            }).then(r => r.data);

            const prompt = `Analise este pull request do repositorio spry-core.
            do autor ${pr.user.login}.

            Titulo: ${pr.title}
            Descricao: ${pr.body || "sem descricao"}

            - Verifique problemas de qualidade de codigo
            - Procure por potenciais bugs
            - Sugira melhorias
            - Seja criativo e bem humorado nas sugestoes

            Diff do PR:
            ${diff.slice(0, 40000)}`;

            const response = await fetch("https://opencode.ai/zen/go/v1/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.OPENCODE_GO_API_KEY}`
              },
              body: JSON.stringify({
                model: "deepseek-v4-flash",
                messages: [
                  { role: "system", content: "Voce e um revisor de codigo experiente." },
                  { role: "user", content: prompt }
                ],
                max_tokens: 4096
              })
            });

            const data = await response.json();
            const review = data.choices?.[0]?.message?.content;

            if (!review) {
              core.error("Resposta vazia da API", JSON.stringify(data));
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## AI Code Review\n\n${review}`
            });
