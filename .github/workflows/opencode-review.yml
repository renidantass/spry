name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.OPENCODE_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff mypy

      - name: Configure Go API key
        run: python3 -c "import json, os; p=os.path.expanduser('~/.config/opencode/opencode.json'); os.makedirs(os.path.dirname(p), exist_ok=True); c=json.load(open(p)) if os.path.exists(p) else {}; c.setdefault('provider',{})['opencode-go']={'options':{'apiKey':os.environ['OPENCODE_GO_API_KEY']}}; json.dump(c, open(p,'w'), indent=2)"

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            You are reviewing PR #${{ github.event.number }}.

            ## Phase 1: Quality Gate
            Run these checks and fix any failures until all pass:
              1. ruff check .
              2. mypy src/
              3. python -m unittest discover -s tests -v

            ## Phase 2: Senior Dev Review
            Review the PR diff as a Senior Developer:
              - Code quality, architecture, design patterns
              - Test coverage and correctness
              - Security vulnerabilities and edge cases
              - Project conventions (type hints, dataclasses, conventional commits)

            ## Phase 3: Write decision
            Based on your review, write your decision to .review_decision
            followed by your feedback. Use exactly one of these formats:

            For solid code:
            ```
            DECISION: approve
            Your feedback here...
            ```

            For changes needed:
            ```
            DECISION: changes
            Detailed list of what needs to change...
            ```

            For minor suggestions:
            ```
            DECISION: comment
            Your suggestions here...
            ```

            DO NOT run gh commands yourself. Only write the decision file.
            Be professional, constructive, and specific.

      - name: Execute review decision
        id: review
        run: |
          PR_NUMBER=${{ github.event.number }}
          DECISION_FILE=".review_decision"
          if [ ! -f "$DECISION_FILE" ]; then
            echo "No decision file found — skipping review action"
            echo "decision=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DECISION=$(head -1 "$DECISION_FILE" | grep -oP 'DECISION: \K\w+')
          BODY=$(tail -n +2 "$DECISION_FILE" | sed '/^```/d' | head -c 32000)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          case "$DECISION" in
            approve)
              echo "Approving PR #$PR_NUMBER..."
              gh pr review "$PR_NUMBER" --approve -b "$BODY"
              echo "Merging PR #$PR_NUMBER..."
              gh pr merge "$PR_NUMBER" --auto --squash
              ;;
            changes)
              echo "Requesting changes on PR #$PR_NUMBER..."
              gh pr review "$PR_NUMBER" --request-changes -b "$BODY"
              ;;
            comment)
              echo "Commenting on PR #$PR_NUMBER..."
              gh pr review "$PR_NUMBER" --comment -b "$BODY"
              ;;
            *)
              echo "Unknown decision: $DECISION"
              ;;
          esac
